[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# Override macOS runners (dist defaults can emit invalid runner names)
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-14"

# Pin every action by commit so a moved tag cannot change what the release
# workflow runs. Keep in step with the SHAs in .github/workflows/release.yml
# (`dist generate` rewrites that file from this table).
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6
"actions/upload-artifact" = "b7c566a772e6b6bfb58ed0dc250532a479d7789f" # v6
"actions/download-artifact" = "37930b1c2abaa49bbe596cd826c3c89aef350131" # v7

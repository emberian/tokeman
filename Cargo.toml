[package]
name = "tokeman"
version = "0.1.1"
edition = "2024"
description = "Anthropic token usage visualizer"
repository = "https://github.com/emberian/tokeman"

[features]
default = []
tray = [
    "dep:tray-icon",
    "dep:eframe",
]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
fs2 = "0.4"
futures = "0.3"
png = "0.18"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["json", "cookies"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
# Comment-preserving TOML editing. Plain `toml::to_string_pretty` round-trips
# through serde and silently discards every comment in tokens.toml.
toml_edit = { version = "0.22", features = ["serde"] }

# System tray (feature-gated)
tray-icon = { version = "0.21", optional = true }
eframe = { version = "0.33", optional = true, features = ["glow"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
# Codex's app-server control socket is JSON-RPC over WebSocket-over-Unix.
tokio-tungstenite = "0.24"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
